name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration
